# ===========================================================================
# voiceagent behavior. Secrets live in .env (see .env.example); this file is
# safe to commit. Loaded + validated by voiceagent/config.py (AppConfig).
#
# ⚠️  The `script`, `compliance`, and `qualifying_criteria` sections below are a
#     WORKING EXAMPLE so you can hear how it sounds in a test call. REPLACE them
#     with your real company, offer, and criteria before calling real leads.
# ===========================================================================

# --- Provider + brain --------------------------------------------------------
voice_provider: retell            # retell | vapi
llm_mode: retell_managed          # retell_managed | custom_claude
                                  #  retell_managed -> Retell's LLM drives calls,
                                  #                    our webhooks serve tools.
                                  #  custom_claude  -> Claude drives every turn.

retell:
  voice_id: ""                    # ElevenLabs voice id on the Retell agent (REQUIRED)
  managed_model: "gpt-4o"         # Retell LLM model (retell_managed). Any Retell-
                                  # supported model, incl. claude-3.7-sonnet, gpt-4.1...
  start_speaker: "agent"          # agent speaks first on outbound
  enable_backchannel: true
  interruption_sensitivity: 0.8   # barge-in (0..1)
  responsiveness: 1.0
  ambient_sound: null

elevenlabs:                       # used by test_elevenlabs.py + agent voice
  voice_id: "EXAVITQu4vr4xnSDxMaL"
  model: "eleven_turbo_v2_5"

claude:                           # custom_claude live brain + offline analysis
  model: "claude-sonnet-4-5"
  max_tokens: 1024
  temperature: 0.7

# --- Calling behavior --------------------------------------------------------
calling:
  concurrency_cap: 5
  calling_hours_start: 8          # 08:00 in the LEAD's local timezone
  calling_hours_end: 20           # 20:00 in the LEAD's local timezone
  max_attempts: 4
  backoff_minutes: [30, 120, 360, 1440]   # delay before retry N (no_answer/voicemail)
  default_timezone: "America/New_York"     # fallback if area-code inference fails

# --- Appointment booking -----------------------------------------------------
booking:
  calendar_id: "primary"          # which Google calendar to read/write
  appointment_minutes: 30
  buffer_minutes: 15
  business_hours_start: 9         # availability offered to leads, in your_timezone
  business_hours_end: 17
  search_days_ahead: 7
  your_timezone: "America/New_York"   # slots are offered in this tz

# --- Human handoff (optional) ------------------------------------------------
escalation:
  enabled: false                  # set true + a number to allow live transfers
  transfer_number: ""             # E.164, e.g. +14155550123 (your sales line)
  transfer_type: "cold_transfer"  # cold_transfer | warm_transfer

# --- Qualifying criteria (agent qualifies BEFORE offering slots) -------------
# Unqualified leads get a polite close, not a booking.   ⚠️ EXAMPLE — edit.
qualifying_criteria:
  - key: is_decision_maker
    question: "Are you the person who handles marketing decisions there?"
    required: true
  - key: has_need
    question: "Are you actively trying to get more customers right now?"
    required: true
  - key: timeframe
    question: "If it were a fit, would you want to start in the next 30-60 days?"
    required: false

# --- Compliance --------------------------------------------------------------
compliance:
  disclose_ai_identity: true      # KEEP ON unless you understand the legal risk
  company_name: "Acme Growth"     # ⚠️ EXAMPLE — your company
  agent_name: "Alex"

# --- Script / offer (injected into the editable prompt) ----------------------
# ⚠️ EXAMPLE OFFER — replace everything below with your real pitch.
script:
  product_name: "Acme Growth"
  one_liner: "we help local home-service businesses book more jobs with done-for-you Google Ads, and you only pay for results"
  primary_pain_points:
    - "spending on ads that don't turn into booked jobs"
    - "leads that never answer or aren't a fit"
    - "no time to manage marketing while running the business"
  call_objective: "book a 20-minute strategy call"
  opening_line: ""                # blank = let the agent open naturally
  voicemail_message: "Hi, this is Alex from Acme Growth — I'll try you again later, or call us back at your convenience. Thanks!"
