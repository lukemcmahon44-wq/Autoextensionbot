name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest -q

      - name: Verify it refuses to start live without credentials (fail-closed)
        run: |
          set +e
          FORCE_PAPER=false python -m src.main
          code=$?
          set -e
          test "$code" = "2" || (echo "expected exit 2, got $code" && exit 1)

      - name: Smoke the offline paper loop end-to-end (no network, no real orders)
        run: |
          FORCE_PAPER=true MAX_CYCLES=5 POLL_INTERVAL_SEC=0.05 SIM_TIME_SCALE=5000 python -m src.main
