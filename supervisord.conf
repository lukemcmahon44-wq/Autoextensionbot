; supervisord.conf — Run the Kalshi trading bot as a managed background process.
;
; Install supervisord:
;   pip install supervisor
;
; Start:
;   supervisord -c supervisord.conf
;
; Check status:
;   supervisorctl -c supervisord.conf status
;
; Tail logs:
;   supervisorctl -c supervisord.conf tail -f kalshi-bot
;
; Stop:
;   supervisorctl -c supervisord.conf stop kalshi-bot

[unix_http_server]
file=/tmp/supervisor_kalshi.sock
chmod=0700

[supervisord]
logfile=supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord_kalshi.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor_kalshi.sock

[program:kalshi-bot]
; ---- Adjust 'command' if your Python executable has a different path ----
command=python main.py
directory=%(here)s

; Auto-restart on crash — waits 5 seconds before restarting
autostart=true
autorestart=true
startretries=999
startsecs=5
stopwaitsecs=10

; Redirect stdout/stderr to the same rotating log the bot uses
stdout_logfile=bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=bot_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

; Environment — supervisord passes the shell environment by default.
; You can hard-code vars here if you prefer not to use a .env file:
; environment=KALSHI_API_KEY="...",TELEGRAM_BOT_TOKEN="..."
