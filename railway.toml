# railway.toml — Railway.app deployment configuration
# Deploy with: railway up
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python main.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check — Railway pings this; since we're a bot (no HTTP server)
# we rely on process health only, so no healthcheck path needed.
# healthcheckPath = "/"
# healthcheckTimeout = 30
